name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: step-security/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install MoonBit 0.10.14 (Linux)
        if: runner.os == 'Linux'
        env:
          MOONBIT_INSTALL_VERSION: 0.10.14+7d59c7ec9
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moonbit.sh"
          bash "$RUNNER_TEMP/install-moonbit.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit 0.10.14 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MOONBIT_INSTALL_VERSION = '0.10.14+7d59c7ec9'
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          $moonBin = Join-Path $HOME '.moon\bin'
          Add-Content -Path $env:GITHUB_PATH -Value $moonBin

      - name: Show toolchain version
        run: moon version --all

      - name: Resolve dependencies
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Type check
        run: moon check --target native

      - name: Run MoonBit tests
        run: moon test --target native

      - name: Build native CLI
        run: moon build --target native

      - name: CLI smoke test
        shell: pwsh
        run: ./scripts/test-cli.ps1

      - name: REPL smoke test
        shell: pwsh
        run: ./scripts/test-repl.ps1
